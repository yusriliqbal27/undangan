<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B7F5E">
<meta name="robots" content="noindex, nofollow">

<!-- Judul & deskripsi diisi otomatis oleh app.js dari config.js -->
<title>Syukuran Nikah Hanan &amp; Iqbal</title>
<meta name="description" content="Merupakan suatu kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir.">

<meta property="og:type" content="website">
<meta property="og:locale" content="id_ID">
<meta property="og:url" content="https://yusriliqbal27.github.io/undangan/">
<meta property="og:title" content="Syukuran Nikah Hanan &amp; Iqbal">
<meta property="og:description" content="Merupakan suatu kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir.">
<meta property="og:image" content="https://yusriliqbal27.github.io/undangan/assets/img/preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://yusriliqbal27.github.io/undangan/assets/img/preview.jpg">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Jost:wght@300..600&family=Parisienne&family=Amiri:wght@400;700&display=swap">

<link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="is-locked">

<!-- ══════════════════════════════════════════════════════════════════════
     COVER — layar pembuka
     ══════════════════════════════════════════════════════════════════════ -->
<section id="cover" class="cover">
  <div class="cover__bg" aria-hidden="true"></div>
  <div class="cover__veil" aria-hidden="true"></div>

  <div class="cover__inner">
    <div class="orn orn--top" data-ornament aria-hidden="true"></div>

    <p class="cover__eyebrow" data-bind="cover.eyebrow"></p>
    <p class="cover__type" data-bind="cover.eventType"></p>

    <h1 class="cover__names">
      <span data-bind="cover.nameA"></span>
      <span class="cover__amp">&amp;</span>
      <span data-bind="cover.nameB"></span>
    </h1>

    <p class="cover__date" data-bind="cover.dateText"></p>

    <div class="cover__guest">
      <p class="cover__guest-label" data-bind="cover.guestLabel"></p>
      <p class="cover__guest-name" id="guest-name"></p>
    </div>

    <button type="button" class="btn btn--solid cover__btn" id="open-invitation">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 6h16v12H4z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span data-bind="cover.buttonText"></span>
    </button>

    <div class="orn orn--bottom" data-ornament aria-hidden="true"></div>
  </div>
</section>


<!-- ══════════════════════════════════════════════════════════════════════
     KONTEN UNDANGAN
     ══════════════════════════════════════════════════════════════════════ -->
<main id="content" class="content" aria-hidden="true">

  <!-- ── Pembuka ─────────────────────────────────────────────────────── -->
  <section class="sect sect--opening" data-section="opening">
    <div class="wrap wrap--narrow center">
      <p class="arabic arabic--lg reveal" data-bind="opening.bismillah"></p>
      <div class="divider reveal" aria-hidden="true"><span></span><i data-ornament-mini></i><span></span></div>
      <p class="arabic reveal" data-bind="opening.verseArabic"></p>
      <p class="quote reveal" data-bind="opening.verseTranslation"></p>
      <p class="quote__src reveal" data-bind="opening.verseSource"></p>
    </div>
  </section>

  <!-- ── Mempelai ────────────────────────────────────────────────────── -->
  <section class="sect sect--couple" data-section="couple">
    <div class="wrap wrap--narrow center">
      <p class="arabic reveal" data-bind="opening.salam"></p>
      <p class="lead reveal" data-bind="opening.intro"></p>
      <div class="couple" id="couple-list"></div>
    </div>
  </section>

  <!-- ── Acara ───────────────────────────────────────────────────────── -->
  <section class="sect sect--events" data-section="events">
    <div class="wrap">
      <header class="sect__head reveal">
        <div class="orn orn--head" data-ornament aria-hidden="true"></div>
        <h2 class="sect__title" data-bind="events.title"></h2>
        <p class="sect__sub" data-bind="events.subtitle"></p>
      </header>
      <div class="events" id="events-list"></div>
    </div>
  </section>

  <!-- ── Countdown ───────────────────────────────────────────────────── -->
  <section class="sect sect--countdown" data-section="countdown">
    <div class="wrap center">
      <h2 class="sect__title sect__title--sm reveal" data-bind="countdown.title"></h2>
      <div class="countdown reveal" id="countdown"></div>
    </div>
  </section>

  <!-- ── Adab ────────────────────────────────────────────────────────── -->
  <section class="sect sect--adab" data-section="adab">
    <div class="wrap wrap--narrow">
      <header class="sect__head reveal">
        <div class="orn orn--head" data-ornament aria-hidden="true"></div>
        <h2 class="sect__title" data-bind="adab.title"></h2>
        <p class="sect__sub" data-bind="adab.subtitle"></p>
      </header>
      <ol class="adab" id="adab-list"></ol>
    </div>
  </section>

  <!-- ── Kisah ───────────────────────────────────────────────────────── -->
  <section class="sect sect--story" data-section="story">
    <div class="wrap wrap--narrow">
      <header class="sect__head reveal">
        <div class="orn orn--head" data-ornament aria-hidden="true"></div>
        <h2 class="sect__title" data-bind="story.title"></h2>
        <p class="sect__sub" data-bind="story.subtitle"></p>
      </header>
      <div class="story" id="story-list"></div>
    </div>
  </section>

  <!-- ── Galeri ──────────────────────────────────────────────────────── -->
  <section class="sect sect--gallery" data-section="gallery">
    <div class="wrap">
      <header class="sect__head reveal">
        <div class="orn orn--head" data-ornament aria-hidden="true"></div>
        <h2 class="sect__title" data-bind="gallery.title"></h2>
        <p class="sect__sub" data-bind="gallery.subtitle"></p>
      </header>
      <div class="gallery" id="gallery-list"></div>
    </div>
  </section>

  <!-- ── Amplop digital ──────────────────────────────────────────────── -->
  <section class="sect sect--gift" data-section="gift">
    <div class="wrap wrap--narrow center">
      <header class="sect__head reveal">
        <div class="orn orn--head" data-ornament aria-hidden="true"></div>
        <h2 class="sect__title" data-bind="gift.title"></h2>
        <p class="sect__sub" data-bind="gift.subtitle"></p>
      </header>
      <button type="button" class="btn btn--outline reveal" id="gift-toggle" data-bind="gift.buttonText"></button>
      <div class="gift" id="gift-list" hidden></div>
    </div>
  </section>

  <!-- ── RSVP ────────────────────────────────────────────────────────── -->
  <section class="sect sect--rsvp" data-section="rsvp">
    <div class="wrap wrap--narrow">
      <header class="sect__head reveal">
        <div class="orn orn--head" data-ornament aria-hidden="true"></div>
        <h2 class="sect__title" data-bind="rsvp.title"></h2>
        <p class="sect__sub" data-bind="rsvp.subtitle"></p>
      </header>

      <form class="form reveal" id="rsvp-form" novalidate>
        <div class="field">
          <label for="f-name" data-bind="rsvp.labels.name"></label>
          <input type="text" id="f-name" name="name" required autocomplete="name">
        </div>

        <div class="field">
          <span class="field__label" data-bind="rsvp.labels.attendance"></span>
          <div class="choices" id="f-attend"></div>
        </div>

        <div class="field" id="f-count-wrap">
          <label for="f-count" data-bind="rsvp.labels.guestCount"></label>
          <select id="f-count" name="guests">
            <option value="1">1 orang</option>
            <option value="2">2 orang</option>
            <option value="3">3 orang</option>
            <option value="4">4 orang</option>
            <option value="5">5 orang</option>
          </select>
        </div>

        <div class="field">
          <label for="f-message" data-bind="rsvp.labels.message"></label>
          <textarea id="f-message" name="message" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn--solid btn--block" id="rsvp-submit"></button>
        <p class="form__note" id="rsvp-note" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <!-- ── Ucapan ──────────────────────────────────────────────────────── -->
  <section class="sect sect--wishes" data-section="wishes">
    <div class="wrap wrap--narrow">
      <header class="sect__head reveal">
        <h2 class="sect__title sect__title--sm" data-bind="wishes.title"></h2>
      </header>
      <div class="wishes" id="wishes-list"></div>
      <button type="button" class="btn btn--ghost btn--block" id="wishes-more" hidden>Lihat lebih banyak</button>
    </div>
  </section>

  <!-- ── Penutup ─────────────────────────────────────────────────────── -->
  <section class="sect sect--closing" data-section="closing">
    <div class="wrap wrap--narrow center">
      <div class="orn orn--head reveal" data-ornament aria-hidden="true"></div>
      <p class="lead reveal" data-bind="closing.text"></p>
      <p class="arabic reveal" data-bind="closing.duaArabic"></p>
      <p class="quote reveal" data-bind="closing.duaTranslation"></p>
      <p class="arabic reveal" data-bind="closing.salam"></p>
      <p class="closing__thanks reveal" data-bind="closing.thanks"></p>
      <p class="closing__names reveal" id="closing-names"></p>
      <p class="closing__family reveal" data-bind="closing.familyLine"></p>
    </div>
  </section>

  <footer class="foot">
    <button type="button" class="btn btn--outline btn--sm" id="share-btn" hidden></button>
    <p class="foot__credit" id="foot-credit"></p>
  </footer>
</main>


<!-- ══════════════════════════════════════════════════════════════════════
     KONTROL MELAYANG
     ══════════════════════════════════════════════════════════════════════ -->
<button type="button" class="music-btn" id="music-btn" hidden aria-label="Putar / hentikan musik">
  <svg class="music-btn__ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </svg>
</button>

<audio id="bgm" loop preload="none"></audio>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
