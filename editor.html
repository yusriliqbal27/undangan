<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Undangan</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
  *,*::before,*::after{box-sizing:border-box}
  *{margin:0}
  :root{
    --bg:#F4F5F3; --panel:#fff; --line:#E2E4E0; --text:#22251F; --muted:#71766C;
    --accent:#6B7F5E; --accent-soft:#EDF1EA; --warn:#B4622F; --radius:10px;
  }
  body{
    font:400 14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  [hidden]{display:none!important}

  /* ── Topbar ─────────────────────────────────────────────── */
  .top{
    display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
    padding:.7rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);flex:none;
  }
  .top__brand{font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:.5rem}
  .top__brand svg{width:22px;height:22px}
  .top__spacer{flex:1}
  .btn{
    display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:8px;
    font-size:.82rem;font-weight:500;border:1px solid var(--line);background:var(--panel);
    transition:background-color .15s,border-color .15s,transform .1s;white-space:nowrap;
  }
  .btn:hover{border-color:#C9CDC5;background:#FAFBF9}
  .btn:active{transform:scale(.98)}
  .btn--primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn--primary:hover{background:#5C6E51;border-color:#5C6E51}
  .btn svg{width:15px;height:15px;flex:none}

  /* ── Layout ─────────────────────────────────────────────── */
  .main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
  @media (max-width:1000px){
    .main{grid-template-columns:1fr}
    .preview{display:none}
    .main.show-preview .form-pane{display:none}
    .main.show-preview .preview{display:flex}
  }

  .form-pane{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:0}
  @media (max-width:700px){ .form-pane{grid-template-columns:1fr} .nav{display:none} }

  /* ── Nav ────────────────────────────────────────────────── */
  .nav{
    border-right:1px solid var(--line);background:var(--panel);
    overflow-y:auto;padding:.6rem;display:flex;flex-direction:column;gap:.1rem;
  }
  .nav button{
    display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;
    padding:.5rem .65rem;border-radius:7px;font-size:.84rem;color:var(--muted);
  }
  .nav button:hover{background:var(--bg)}
  .nav button.is-active{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .nav__n{
    font-size:.68rem;width:19px;height:19px;flex:none;display:grid;place-items:center;
    border-radius:5px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .nav button.is-active .nav__n{background:var(--accent);color:#fff}

  /* ── Form ───────────────────────────────────────────────── */
  .pane{overflow-y:auto;padding:1.5rem 1.5rem 5rem;scroll-behavior:smooth}
  .group{margin-bottom:2.5rem;scroll-margin-top:1rem}
  .group__head{margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--line)}
  .group__title{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
  .group__hint{font-size:.8rem;color:var(--muted);margin-top:.2rem}

  .row{display:grid;gap:.3rem;margin-bottom:.95rem;max-width:640px}
  .row label{font-size:.78rem;font-weight:500;color:var(--muted)}
  .row .hint{font-size:.73rem;color:var(--muted);opacity:.85}
  .row input[type=text],.row input[type=url],.row input[type=number],
  .row input[type=datetime-local],.row select,.row textarea{
    width:100%;padding:.55rem .7rem;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;font-size:.87rem;
  }
  .row textarea{resize:vertical;min-height:5rem;line-height:1.65}
  .row :is(input,select,textarea):focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgb(107 127 94 / .14);
  }
  .row--rtl textarea,.row--rtl input{direction:rtl;text-align:right;font-size:1.05rem;line-height:2}

  .switch{display:flex;align-items:center;gap:.6rem;cursor:pointer;max-width:640px;margin-bottom:.95rem}
  .switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:#D3D6D0;position:relative;transition:background-color .2s;flex:none;margin:0}
  .switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgb(0 0 0/.2)}
  .switch input:checked{background:var(--accent)}
  .switch input:checked::after{transform:translateX(16px)}
  .switch span{font-size:.86rem;font-weight:500}

  .colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem;max-width:640px}
  .color{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .color input[type=color]{width:30px;height:30px;padding:0;border:0;border-radius:6px;background:none;flex:none;cursor:pointer}
  .color div{min-width:0}
  .color b{display:block;font-size:.75rem;font-weight:500}
  .color small{font-size:.68rem;color:var(--muted);font-family:ui-monospace,monospace}

  /* ── List editor ────────────────────────────────────────── */
  .items{display:grid;gap:.6rem;max-width:640px;margin-bottom:.6rem}
  .item{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:.85rem}
  .item__bar{display:flex;align-items:center;gap:.4rem;margin-bottom:.6rem}
  .item__n{font-size:.72rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:.15rem .5rem;border-radius:5px}
  .item__bar .sp{flex:1}
  .icobtn{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
  .icobtn:hover{background:var(--bg);color:var(--text)}
  .icobtn--del:hover{background:#FBEEEA;color:var(--warn)}
  .icobtn svg{width:15px;height:15px}
  .item .row{margin-bottom:.6rem}
  .item .row:last-child{margin-bottom:0}
  .item--simple{display:flex;gap:.5rem;align-items:flex-start;padding:.5rem}
  .item--simple textarea{min-height:3.4rem}

  /* ── Preview ────────────────────────────────────────────── */
  .preview{background:#23261F;display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0}
  .preview__bar{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;color:#B9BEB2;font-size:.76rem;border-bottom:1px solid #33372D}
  .preview__bar .sp{flex:1}
  .preview__bar button{color:#D6DACE;font-size:.76rem;padding:.3rem .6rem;border-radius:6px;border:1px solid #3D4237}
  .preview__bar button:hover{background:#2E322A}
  .preview__frame{flex:1;min-height:0;display:grid;place-items:center;padding:.75rem;overflow:hidden}
  .preview iframe{width:100%;max-width:390px;height:100%;border:0;border-radius:14px;background:#fff;box-shadow:0 10px 40px rgb(0 0 0/.4)}

  /* ── Toast ──────────────────────────────────────────────── */
  .toast{
    position:fixed;bottom:1.25rem;left:50%;transform:translate(-50%,150%);
    background:#22251F;color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.82rem;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:transform .35s cubic-bezier(.22,.68,.32,1),opacity .25s,visibility .25s;
    z-index:50;box-shadow:0 8px 30px rgb(0 0 0/.25);
  }
  .toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}

  .note{
    background:#FFF8E8;border:1px solid #EFDFB4;color:#6B5626;
    padding:.7rem .85rem;border-radius:8px;font-size:.8rem;max-width:640px;margin-bottom:1rem;line-height:1.6;
  }
  .note code{background:rgb(0 0 0/.06);padding:.05rem .3rem;border-radius:4px;font-size:.95em}
</style>
</head>
<body>

<header class="top">
  <div class="top__brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#6B7F5E"/>
      <g fill="none" stroke="#D9C08A" stroke-width="3.5" stroke-linejoin="round">
        <rect x="19" y="19" width="26" height="26"/>
        <rect x="19" y="19" width="26" height="26" transform="rotate(45 32 32)"/>
      </g>
    </svg>
    Editor Undangan
  </div>
  <div class="top__spacer"></div>
  <button class="btn" id="btn-preview-toggle" hidden>Preview</button>
  <button class="btn" id="btn-load">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    Muat config
  </button>
  <button class="btn btn--primary" id="btn-save">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    Download config.js
  </button>
  <input type="file" id="file-input" accept=".js,.json,text/javascript" hidden>
</header>

<div class="main" id="main">
  <div class="form-pane">
    <nav class="nav" id="nav"></nav>
    <div class="pane" id="pane"></div>
  </div>

  <aside class="preview">
    <div class="preview__bar">
      <span>Preview langsung</span>
      <span class="sp"></span>
      <button id="btn-refresh">Muat ulang</button>
      <button id="btn-open">Buka tab baru</button>
    </div>
    <div class="preview__frame"><iframe id="frame" title="Preview undangan"></iframe></div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/config.js"></script>

    { key: "closing", icon: "13", title: "Penutup", fields: [
      { p: "closing.enabled", l: "Tampilkan bagian penutup", t: T.bool },
      { p: "closing.text", l: "Kalimat penutup", t: T.area },
      { p: "closing.duaArabic", l: "Doa (Arab)", t: T.rtl },
      { p: "closing.duaTranslation", l: "Terjemahan doa", t: T.area },
      { p: "closing.salam", l: "Salam penutup (Arab)", t: T.rtl },
      { p: "closing.thanks", l: "Kalimat sebelum nama", t: T.text },
      { p: "closing.familyLine", l: "Baris keluarga", t: T.text },
    ]},

    { key: "music", icon: "14", title: "Musik & Share", fields: [
      { p: "music.enabled", l: "Nyalakan musik latar", t: T.bool },
      { p: "music.url", l: "File musik", t: T.text, h: "Taruh .mp3 di assets/audio/ lalu tulis: assets/audio/backsound.mp3" },
      { sub: "Tombol Bagikan" },
      { p: "footer.shareButton", l: "Tampilkan tombol bagikan", t: T.bool },
      { p: "footer.shareButtonText", l: "Tulisan tombol", t: T.text },
      { p: "footer.shareTemplate", l: "Template pesan WhatsApp", t: T.area, h: "Tulis {link} di tempat link undangan akan disisipkan." },
      { p: "footer.credit", l: "Tulisan footer", t: T.text },
      { p: "footer.creditName", l: "Nama pembuat", t: T.text },
      { p: "footer.creditUrl", l: "Link pembuat", t: T.text },
    ]},
  ];


  /* ══════════════════════════════════════════════════════════
     AKSES NILAI BERSARANG
     ══════════════════════════════════════════════════════════ */
  const getVal = (obj, path) =>
    path.split(".").reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), obj);

  function setVal(obj, path, val) {
    const keys = path.split(".");
    const last = keys.pop();
    let cur = obj;
    for (const k of keys) {
      if (typeof cur[k] !== "object" || cur[k] === null) cur[k] = {};
      cur = cur[k];
    }
    cur[last] = val;
  }

  const ICONS = {
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 14 6-6 6 6"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 10 6 6 6-6"/></svg>',
    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  };

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


  /* ══════════════════════════════════════════════════════════
     RENDER FORM
     ══════════════════════════════════════════════════════════ */
  let dirty = false;
  function touched() {
    dirty = true;
    clearTimeout(touched._t);
    touched._t = setTimeout(refreshPreview, 700);
  }

  function fieldEl(f, scope, onChange) {
    // Sub-heading
    if (f.sub && !f.p) {
      const h = document.createElement("p");
      h.style.cssText = "font-size:.8rem;font-weight:600;margin:1.5rem 0 .75rem;color:var(--accent);letter-spacing:.02em";
      h.textContent = f.sub;
      return h;
    }

    const val = getVal(scope, f.p);
    const wrap = document.createElement("div");

    /* — Saklar on/off — */
    if (f.t === T.bool) {
      wrap.className = "switch";
      wrap.innerHTML = `<input type="checkbox"${val !== false ? " checked" : ""}><span>${esc(f.l)}</span>`;
      if (f.h) {
        const hint = document.createElement("span");
        hint.className = "hint";
        hint.style.cssText = "font-weight:400;color:var(--muted)";
        hint.textContent = "— " + f.h;
        wrap.appendChild(hint);
      }
      wrap.querySelector("input").addEventListener("change", (e) => {
        setVal(scope, f.p, e.target.checked);
        onChange();
      });
      return wrap;
    }

    /* — Warna custom — */
    if (f.t === T.color) {
      wrap.className = "row";
      const NAMES = { primary: "Warna utama", secondary: "Warna aksen", bg: "Latar halaman",
                      surface: "Latar kartu", text: "Tulisan utama", muted: "Tulisan sekunder" };
      wrap.innerHTML = `<label>${esc(f.l)}</label>${f.h ? `<span class="hint">${esc(f.h)}</span>` : ""}
        <div class="colors">${Object.entries(NAMES).map(([k, n]) => {
          const c = (val && val[k]) || "#000000";
          return `<label class="color"><input type="color" value="${esc(c)}" data-ck="${k}">
            <div><b>${esc(n)}</b><small>${esc(c)}</small></div></label>`;
        }).join("")}</div>`;
      wrap.querySelectorAll("input[type=color]").forEach((inp) => {
        inp.addEventListener("input", (e) => {
          setVal(scope, f.p + "." + e.target.dataset.ck, e.target.value);
          e.target.parentElement.querySelector("small").textContent = e.target.value;
          onChange();
        });
      });
      return wrap;
    }

    /* — Daftar teks sederhana — */
    if (f.t === T.strlist) {
      wrap.className = "row";
      wrap.innerHTML = `<label>${esc(f.l)}</label>${f.h ? `<span class="hint">${esc(f.h)}</span>` : ""}`;
      const box = document.createElement("div");
      box.className = "items";
      wrap.appendChild(box);

      const draw = () => {
        const arr = getVal(scope, f.p) || [];
        box.innerHTML = "";
        arr.forEach((txt, i) => {
          const it = document.createElement("div");
          it.className = "item item--simple";
          it.innerHTML = `<span class="item__n">${i + 1}</span>
            <textarea style="flex:1">${esc(txt)}</textarea>
            <button class="icobtn" data-a="up" title="Naik">${ICONS.up}</button>
            <button class="icobtn" data-a="down" title="Turun">${ICONS.down}</button>
            <button class="icobtn icobtn--del" data-a="del" title="Hapus">${ICONS.del}</button>`;
          it.querySelector("textarea").addEventListener("input", (e) => { arr[i] = e.target.value; onChange(); });
          it.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => {
            const a = b.dataset.a;
            if (a === "del") arr.splice(i, 1);
            if (a === "up" && i > 0) arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
            if (a === "down" && i < arr.length - 1) arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
            draw(); onChange();
          }));
          box.appendChild(it);
        });
      };
      draw();

      const add = document.createElement("button");
      add.className = "btn";
      add.innerHTML = ICONS.plus + esc(f.add || "Tambah");
      add.addEventListener("click", () => {
        if (!Array.isArray(getVal(scope, f.p))) setVal(scope, f.p, []);
        getVal(scope, f.p).push("");
        draw(); onChange();
      });
      wrap.appendChild(add);
      return wrap;
    }

    /* — Daftar objek (acara, cerita, rekening) — */
    if (f.t === T.objlist) {
      wrap.className = "row";
      wrap.innerHTML = `<label>${esc(f.l)}</label>${f.h ? `<span class="hint">${esc(f.h)}</span>` : ""}`;
      const box = document.createElement("div");
      box.className = "items";
      wrap.appendChild(box);

      const draw = () => {
        const arr = getVal(scope, f.p) || [];
        box.innerHTML = "";
        arr.forEach((obj, i) => {
          const it = document.createElement("div");
          it.className = "item";
          const bar = document.createElement("div");
          bar.className = "item__bar";
          bar.innerHTML = `<span class="item__n">${esc(f.l)} ${i + 1}</span><span class="sp"></span>
            <button class="icobtn" data-a="up">${ICONS.up}</button>
            <button class="icobtn" data-a="down">${ICONS.down}</button>
            <button class="icobtn icobtn--del" data-a="del">${ICONS.del}</button>`;
          bar.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => {
            const a = b.dataset.a;
            if (a === "del") arr.splice(i, 1);
            if (a === "up" && i > 0) arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
            if (a === "down" && i < arr.length - 1) arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
            draw(); onChange();
          }));
          it.appendChild(bar);
          f.sub.forEach((sf) => it.appendChild(fieldEl(sf, obj, onChange)));
          box.appendChild(it);
        });
      };
      draw();

      const add = document.createElement("button");
      add.className = "btn";
      add.innerHTML = ICONS.plus + esc(f.add || "Tambah");
      add.addEventListener("click", () => {
        if (!Array.isArray(getVal(scope, f.p))) setVal(scope, f.p, []);
        const blank = {};
        f.sub.forEach((sf) => (blank[sf.p] = ""));
        getVal(scope, f.p).push(blank);
        draw(); onChange();
      });
      wrap.appendChild(add);
      return wrap;
    }

    /* — Field biasa — */
    wrap.className = "row" + (f.t === T.rtl ? " row--rtl" : "");
    let input;
    if (f.t === T.sel) {
      input = document.createElement("select");
      input.innerHTML = f.o.map(([v, lbl]) =>
        `<option value="${esc(v)}"${v === val ? " selected" : ""}>${esc(lbl)}</option>`).join("");
    } else if (f.t === T.area || f.t === T.rtl) {
      input = document.createElement("textarea");
      input.value = val ?? "";
      if (f.t === T.rtl) input.rows = 3;
    } else {
      input = document.createElement("input");
      input.type = f.t === T.num ? "number" : "text";
      input.value = val ?? "";
    }

    const lab = document.createElement("label");
    lab.textContent = f.l;
    wrap.appendChild(lab);
    if (f.h) {
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = f.h;
      wrap.appendChild(hint);
    }
    wrap.appendChild(input);

    input.addEventListener("input", (e) => {
      setVal(scope, f.p, f.t === T.num ? Number(e.target.value) : e.target.value);
      onChange();
    });
    return wrap;
  }

  function render() {
    const nav = $("#nav");
    const pane = $("#pane");
    nav.innerHTML = "";
    pane.innerHTML = "";

    pane.insertAdjacentHTML("beforeend",
      `<div class="note"><b>Cara pakai:</b> ubah isian di bawah, lihat hasilnya di panel preview,
       lalu klik <b>Download config.js</b>. Ganti file <code>assets/js/config.js</code> di folder
       undangan kamu dengan file hasil download itu.</div>`);

    SCHEMA.forEach((g, gi) => {
      const btn = document.createElement("button");
      btn.innerHTML = `<span class="nav__n">${g.icon}</span>${esc(g.title)}`;
      btn.addEventListener("click", () => {
        document.getElementById("g-" + g.key).scrollIntoView({ behavior: "smooth", block: "start" });
      });
      nav.appendChild(btn);

      const sec = document.createElement("section");
      sec.className = "group";
      sec.id = "g-" + g.key;
      sec.innerHTML = `<div class="group__head">
          <h2 class="group__title">${esc(g.title)}</h2>
          ${g.hint ? `<p class="group__hint">${esc(g.hint)}</p>` : ""}
        </div>`;
      g.fields.forEach((f) => sec.appendChild(fieldEl(f, data, touched)));
      pane.appendChild(sec);
    });

    // Sorot menu sesuai posisi scroll
    const groups = [...pane.querySelectorAll(".group")];
    const btns = [...nav.querySelectorAll("button")];
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        const i = groups.indexOf(e.target);
        btns.forEach((b, j) => b.classList.toggle("is-active", i === j));
      });
    }, { rootMargin: "-10% 0px -80% 0px" });
    groups.forEach((g) => io.observe(g));
    btns[0]?.classList.add("is-active");
  }


  /* ══════════════════════════════════════════════════════════
     PREVIEW
     ══════════════════════════════════════════════════════════ */
  function refreshPreview() {
    try { sessionStorage.setItem("undangan_preview_config", JSON.stringify(data)); } catch (e) {}
    const f = $("#frame");
    f.src = "index.html?preview=1&to=" + encodeURIComponent("Bapak / Ibu / Saudara/i") + "&_=" + Date.now();
  }


  /* ══════════════════════════════════════════════════════════
     SERIALISASI KE config.js
     ══════════════════════════════════════════════════════════ */
  const COMMENTS = {
    meta:      "1. META — judul tab browser & tampilan saat link di-share",
    theme:     "2. TEMA — warna & font",
    music:     "3. MUSIK LATAR",
    cover:     "4. HALAMAN COVER — layar pertama sebelum undangan dibuka",
    opening:   "5. PEMBUKA — bismillah + ayat",
    couple:    "6. MEMPELAI",
    events:    "7. ACARA",
    countdown: "8. HITUNG MUNDUR",
    adab:      "9. ADAB MENGHADIRI WALIMAH",
    story:     "10. KISAH KAMI",
    gallery:   "11. GALERI FOTO",
    rsvp:      "12. RSVP",
    wishes:    "13. BUKU TAMU",
    gift:      "14. AMPLOP DIGITAL / HADIAH",
    closing:   "15. PENUTUP",
    footer:    "16. FOOTER & TOMBOL SHARE",
  };

  function toConfigJs(obj) {
    const head =
      "/* ============================================================================\n" +
      " *  KONFIGURASI UNDANGAN DIGITAL\n" +
      " *  Dibuat lewat editor.html pada " + new Date().toLocaleString("id-ID") + "\n" +
      " *\n" +
      " *  Ubah tulisan di dalam tanda kutip. Jangan hapus koma, kurung kurawal { },\n" +
      " *  atau kurung siku [ ]. Bisa juga diedit ulang lewat editor.html.\n" +
      " * ========================================================================== */\n\n" +
      "const CONFIG = {\n";

    const body = Object.keys(obj).map((k) => {
      const json = JSON.stringify(obj[k], null, 2)
        .split("\n").map((l, i) => (i === 0 ? l : "  " + l)).join("\n");
      const c = COMMENTS[k];
      return (c ? `  /* ── ${c} ${"─".repeat(Math.max(2, 62 - c.length))} */\n` : "") +
             `  ${k}: ${json},`;
    }).join("\n\n");

    return head + body + "\n};\n\n" +
      "/* ⚠️ JANGAN UBAH BARIS DI BAWAH INI —\n" +
      "   baris ini yang menyambungkan config ke halaman undangan. */\n" +
      'if (typeof window !== "undefined") { window.CONFIG = CONFIG; }\n' +
      'if (typeof module !== "undefined") { module.exports = CONFIG; }\n';
  }

  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("on"), 2600);
  }

  function download() {
    const text = toConfigJs(data);
    // Cek dulu hasilnya valid JavaScript sebelum diunduh
    try { new Function(text.replace(/window/g, "globalThis")); }
    catch (e) { toast("Ada isian yang bermasalah: " + e.message); return; }

    const blob = new Blob([text], { type: "text/javascript;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "config.js";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    dirty = false;
    toast("config.js terunduh — timpa file lama di assets/js/");
  }

  function loadFile(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const src = String(r.result);
        // Jalankan isi file di kotak terisolasi untuk mengambil objek CONFIG
        const fn = new Function(src + "\n;return typeof CONFIG !== 'undefined' ? CONFIG : null;");
        const cfg = fn.call({});
        if (!cfg || typeof cfg !== "object") throw new Error("objek CONFIG tidak ditemukan");
        data = clone(cfg);
        render();
        refreshPreview();
        toast("Config berhasil dimuat.");
      } catch (e) {
        toast("File tidak bisa dibaca: " + e.message);
      }
    };
    r.readAsText(file);
  }


  /* ══════════════════════════════════════════════════════════
     PASANG
     ══════════════════════════════════════════════════════════ */
  $("#btn-save").addEventListener("click", download);
  $("#btn-load").addEventListener("click", () => $("#file-input").click());
  $("#file-input").addEventListener("change", (e) => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
    e.target.value = "";
  });
  $("#btn-refresh").addEventListener("click", refreshPreview);
  $("#btn-open").addEventListener("click", () => {
    try { sessionStorage.setItem("undangan_preview_config", JSON.stringify(data)); } catch (err) {}
    window.open("index.html?preview=1", "_blank");
  });

  // Tombol preview untuk layar kecil
  const mq = window.matchMedia("(max-width:1000px)");
  const syncMq = () => { $("#btn-preview-toggle").hidden = !mq.matches; };
  mq.addEventListener("change", syncMq); syncMq();
  $("#btn-preview-toggle").addEventListener("click", () => {
    const m = $("#main");
    m.classList.toggle("show-preview");
    $("#btn-preview-toggle").textContent = m.classList.contains("show-preview") ? "Kembali ke Editor" : "Preview";
    if (m.classList.contains("show-preview")) refreshPreview();
  });

  window.addEventListener("beforeunload", (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";
  });

  if (!window.CONFIG) {
    document.body.innerHTML =
      '<div style="padding:2rem;max-width:38rem;margin:auto;font-family:system-ui;line-height:1.7">' +
      "<h2>config.js belum terbaca</h2><p>Editor perlu dibuka lewat server lokal, bukan " +
      "dengan klik dua kali file-nya. Buka Terminal di folder undangan lalu jalankan:</p>" +
      "<pre style='background:#EFEFEC;padding:1rem;border-radius:8px'>python3 -m http.server 8000</pre>" +
      "<p>Lalu buka <b>http://localhost:8000/editor.html</b> di browser.</p></div>";
    return;
  }

  render();
  refreshPreview();
})();
</script>
</body>
</html>
